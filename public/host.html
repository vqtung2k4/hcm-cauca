<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Màn hình Host - Leaderboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a2a3a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* Cải tiến giao diện nhập liệu */
        .setup-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 50px;
            border: 1px solid rgba(33, 150, 243, 0.3);
        }

        input[type="number"] {
            padding: 15px;
            font-size: 20px;
            width: 100px;
            border-radius: 10px;
            border: none;
            text-align: center;
            margin: 0 10px;
        }

        /* Leaderboard Style */
        #leaderboard-table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
        }

        th,
        td {
            padding: 20px;
            font-size: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: #2196F3;
        }

        .rank-1 {
            color: #FFD700;
            font-size: 32px;
            font-weight: bold;
        }

        .rank-2 {
            color: #C0C0C0;
        }

        .rank-3 {
            color: #CD7F32;
        }

        #timer-display {
            font-size: 48px;
            color: #F44336;
            margin: 20px;
            font-weight: bold;
        }

        .room-info {
            font-size: 20px;
            background: #333;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }

        button {
            padding: 15px 30px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
    </style>
</head>

<body>

    <!-- BƯỚC 1: CÀI ĐẶT (Đã cập nhật phần nhập thời gian) -->
    <div id="host-setup" class="screen active">
        <h1>🎏 THIẾT LẬP PHÒNG CÂU CÁ</h1>
        <div class="setup-container">
            <h2 style="margin-bottom: 30px;">Nhập thời gian trận đấu</h2>
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 30px;">
                <input type="number" id="input-duration" value="10" min="1" max="60">
                <span style="font-size: 24px;">Phút</span>
            </div>
            <button onclick="handleCreateRoom()"
                style="font-size: 24px; background: #2196F3; color: white; width: 100%;">TẠO PHÒNG</button>
        </div>
    </div>

    <!-- BƯỚC 2: PHÒNG CHỜ (LOBBY) -->
    <div id="host-lobby" class="screen">
        <h1>Mã Phòng: <span id="room-display"
                style="color:#2196F3; background:white; padding:0 10px; border-radius:5px">------</span></h1>
        <div id="player-count" style="font-size:24px; margin:20px">Ngư thủ đã vào: 0</div>
        <div id="player-list" style="font-size:18px; color:#aaa; margin-bottom:30px">Đang đợi mọi người kết nối...</div>
        <button onclick="sendStartGame()"
            style="padding:15px 40px; font-size:24px; background:#4CAF50; color:white;">BẮT ĐẦU NGAY</button>
    </div>

    <!-- BƯỚC 3: TRẬN ĐẤU & LEADERBOARD -->
    <div id="host-game" class="screen">
        <div class="room-info">Phòng: <span id="game-room-code">---</span></div>
        <div id="timer-display">00:00</div>

        <h2>🏆 BẢNG XẾP HẠNG NGƯ THỦ 🏆</h2>
        <table id="leaderboard-table">
            <thead>
                <tr>
                    <th>Hạng</th>
                    <th>Ngư thủ</th>
                    <th>Điểm số</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
            </tbody>
        </table>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomCode = "";
        let timeLeft = 0;
        let timerInterval;

        // Hàm xử lý lấy giá trị từ input và gọi server tạo phòng
        function handleCreateRoom() {
            const durationInput = document.getElementById('input-duration').value;
            const duration = parseInt(durationInput);

            if (isNaN(duration) || duration <= 0) {
                alert("Vui lòng nhập số phút hợp lệ (ví dụ: 10)!");
                return;
            }
            if (duration > 60) {
                alert("Thời gian tối đa là 60 phút!");
                return;
            }

            socket.emit('createRoom', { duration: duration });
        }

        socket.on('roomCreated', (data) => {
            myRoomCode = data.roomCode;
            timeLeft = data.duration * 60;
            document.getElementById('room-display').innerText = myRoomCode;
            document.getElementById('game-room-code').innerText = myRoomCode;
            showScreen('host-lobby');
        });

        socket.on('updatePlayerList', (players) => {
            document.getElementById('player-count').innerText = "Ngư thủ đã vào: " + players.length;
            document.getElementById('player-list').innerText = players.map(p => p.name).join(', ');
        });

        function sendStartGame() {
            socket.emit('startGame', myRoomCode);
            showScreen('host-game');
            startCountdown();
        }

        socket.on('updateLeaderboard', (leaderboard) => {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = leaderboard.map((p, i) => `
                <tr class="rank-${i + 1}">
                    <td>${i + 1}</td>
                    <td>${p.name}</td>
                    <td>${p.score.toLocaleString()} đ</td>
                </tr>
            `).join('');
        });

        function startCountdown() {
            console.log("Bắt đầu đếm ngược cho phòng: " + myRoomCode);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer-display').innerText = "0:00";
                    socket.emit('endGame', myRoomCode);
                    return;
                }
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timer-display').innerText = 
                    `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>

</html>
